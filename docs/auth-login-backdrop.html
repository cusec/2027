<!--
  Source for public/assets/auth/login-backdrop.webp — the background image set
  on Auth0's Universal Login page.

  Auth0 only lets a free tenant set a background image, not page HTML (a real
  card beside the widget needs Page Templates, which require a custom domain).
  So the card is painted into the background instead, on the right, with the
  widget left-aligned in Auth0's own settings.

  To regenerate after editing this file:

    chrome --headless=new --window-size=1920,1080 --hide-scrollbars       --screenshot=backdrop.png file:///absolute/path/to/this/file
    node -e "require('sharp')('backdrop.png').webp({quality:82})
      .toFile('public/assets/auth/login-backdrop.webp')"

  The @font-face below points at the pixel face inside node_modules, so run it
  from a checkout with dependencies installed.
-->
<!doctype html>
<meta charset="utf-8">
<style>
@font-face {
  font-family: "GeistPixelSquare";
  src: url("file:///C:/Users/angel/cusec/CUSEC%202027/cusec-2027/node_modules/geist/dist/fonts/geist-pixel/GeistPixel-Square.woff2") format("woff2");
  font-weight: 700;
}

* { box-sizing: border-box; }

html, body { margin: 0; }

body {

  height: 1080px;
  overflow: hidden;

}

.panel {

  text-align: center;

}

.logo {

}

.body {

}

.facts {

.facts li {

  background: rgba(255, 255, 255, 0.6);
  font-family: "GeistPixelSquare", monospace;
  font-size: 13px;
  letter-spacing: 0.06em;
  color: #0E664D;

/* A phone crops this image to its centre ~400px (cover scales by height, so
   the full 1080 is visible but only ~26% of the width). The panel on the
   right is gone at that size, and the widget covers the middle — so the
   identity is repeated here, narrow enough and high enough to survive both
   the crop and the widget. Keep it under ~330px wide: a 320px-wide phone
   only shows the middle ~410px of this image. */
.lockup {
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  width: 326px;
  padding: 11px 18px;
  border: 1px solid rgba(255, 255, 255, 0.34);
  border-radius: 999px;

    rgba(9, 28, 45, 0.42),
    rgba(9, 28, 45, 0.3)
  );
  box-shadow: 0 8px 20px rgba(9, 28, 45, 0.34);
  backdrop-filter: blur(10px);
  text-align: left;
}

.lockup img {
  width: 34px;
  height: 34px;
  flex: none;
}

.lockup b {
  display: block;
  font-family: "GeistPixelSquare", monospace;
